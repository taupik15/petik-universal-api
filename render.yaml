services:
  - type: web
    name: petik-universal-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MAX_FILE_MB
        value: "140"
      - key: MAX_DURATION_SECONDS
        value: "3600"
      - key: FILE_TTL_SECONDS
        value: "1800"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: RATE_LIMIT_COUNT
        value: "40"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "300"
      - key: YTDLP_AUTO_UPDATE
        value: "1"
      - key: MAX_GALLERY_ITEMS
        value: "20"
      - key: MAX_GALLERY_FILE_MB
        value: "20"
      - key: MAX_GALLERY_TOTAL_MB
        value: "60"
