services:
  - type: web
    name: petik-universal-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MAX_FILE_MB
        value: "140"
      - key: MAX_DURATION_SECONDS
        value: "3600"
      - key: FILE_TTL_SECONDS
        value: "1800"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: RATE_LIMIT_COUNT
        value: "40"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "300"
      - key: YTDLP_AUTO_UPDATE
        value: "1"
      - key: BGUTIL_POT_PROVIDER_ENABLED
        value: "1"
      - key: BGUTIL_POT_PROVIDER_URL
        value: "http://127.0.0.1:4416"
      - key: BGUTIL_PROVIDER_PORT
        value: "4416"
      - key: BGUTIL_TELEMETRY_PORT
        value: "4417"
      - key: BGUTIL_TELEMETRY_URL
        value: "http://127.0.0.1:4417"
      - key: YOUTUBE_FORCE_IPV4
        value: "1"
      - key: YOUTUBE_WPC_ENABLED
        value: "0"
      - key: BGUTIL_PROVIDER_START_TIMEOUT
        value: "25"
      - key: MAX_GALLERY_ITEMS
        value: "20"
      - key: MAX_GALLERY_FILE_MB
        value: "20"
      - key: MAX_GALLERY_VIDEO_MB
        value: "140"
      - key: MAX_GALLERY_TOTAL_MB
        value: "300"
